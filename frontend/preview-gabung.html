<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview Gabung UI</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #3a3a2f;
        font-family: "Courier New", monospace;
        color: #e9e6d6;
      }
      .frame {
        width: 100%;
        max-width: 900px;
        border-radius: 18px;
        border: 1px solid #d9d3ba;
        background: #d9d3ba;
        padding: 10px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }
      .shell {
        border-radius: 12px;
        border: 1px solid #a89f83;
        background: #0a0e2a;
        overflow: hidden;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: #111834;
        border-bottom: 1px solid #161f42;
      }
      .topbar .title {
        background: #e9e6d6;
        color: #0a0e2a;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      .dots {
        display: flex;
        gap: 6px;
      }
      .dots span {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: #e9e6d6;
      }
      .content {
        padding: 24px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7d84ab;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 22px;
        text-transform: uppercase;
        line-height: 1.3;
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #111834;
        border: 1px solid #161f42;
        margin-bottom: 18px;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        background: #e9e6d6;
        color: #0a0e2a;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .badge .label {
        font-size: 10px;
        color: #7d84ab;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }
      .badge .name {
        font-size: 14px;
        margin-top: 2px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #f2c94c;
      }
      input {
        width: 100%;
        border: 1px solid #161f42;
        background: #111834;
        color: #e9e6d6;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 16px;
        outline: none;
      }
      input:focus {
        border-color: #f2c94c;
      }
      .code-row {
        display: flex;
        gap: 8px;
      }
      .code-box {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        border: 1px solid #3e4a77;
        background: #111834;
        color: #f2c94c;
        font-size: 18px;
        text-align: center;
      }
      .hint {
        text-align: center;
        font-size: 13px;
        color: #7d84ab;
        margin-top: 6px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        background: #f2c94c;
        color: #0a0e2a;
        padding: 12px;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .statusbar {
        display: flex;
        justify-content: space-between;
        padding: 10px 14px;
        background: #111834;
        border-top: 1px solid #161f42;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .statusbar .right {
        color: #7d84ab;
      }
      @media (max-width: 640px) {
        .content {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="shell">
        <div class="topbar">
          <div class="title">GABUNG_SESI.EXE</div>
          <div class="dots"><span></span><span></span></div>
        </div>
        <div class="content">
          <div class="eyebrow">// masuk arena</div>
          <h1>Gabung sesi cerdas cermat</h1>

          <div class="badge">
            <div class="avatar">T</div>
            <div>
              <div class="label">Tim kamu</div>
              <div class="name">Tim Alpha</div>
            </div>
          </div>

          <label>Nama Tim</label>
          <input placeholder="cth. Elang Merah" />

          <label>Kode Sesi</label>
          <div class="code-row">
            <input class="code-box" value="A" />
            <input class="code-box" value="B" />
            <input class="code-box" value="C" />
            <input class="code-box" value="D" />
            <input class="code-box" value="E" />
            <input class="code-box" value="F" />
          </div>
          <div class="hint">masukkan 6 karakter kode dari gurumu</div>
          <button>GABUNG</button>
        </div>
        <div class="statusbar">
          <span>● ROOM</span>
          <span class="right">--:--</span>
        </div>
      </div>
    </div>
  </body>
</html>
